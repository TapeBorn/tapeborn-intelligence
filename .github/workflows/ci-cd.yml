# TapeBorn CI/CD Pipeline
#
# SECURITY (F-19 remediation, 2026-09-27):
# A push/merge to main MUST NOT automatically deploy to Arc mainnet or testnet.
# The previous version of this workflow ran `node scripts/deploy-mainnet.js` on every
# push to main using the DEV_WALLET_PRIVATE_KEY secret (testnet deploy unconditional,
# mainnet deploy gated only by a dead `github.event.inputs.confirm == 'true' || false`
# expression — an ACCIDENTAL gate, not an explicit one).
#
# Production deployment is now MANUAL-ONLY, operator-invoked, and must follow the
# preflight + confirmation ceremony documented in docs/deployment.md:
#
#   push main
#     ↓
#   CI test/build/audit          (this workflow — NO production write)
#     ↓
#   explicit deployment invocation   (operator, NOT CI)
#     ↓
#   preflight                        (npm run preflight)
#     ↓
#   human/operator confirmation
#     ↓
#   deployment
#     ↓
#   on-chain verification
#
# Do not reintroduce an auto-deploy mechanism in this file. If a deployment workflow
# is ever needed, it must be triggered by explicit manual invocation only
# (e.g. workflow_dispatch with a required confirmation input) and reviewed as a
# security change.

name: TapeBorn CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.18.0'

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint (syntax check)
        run: npm run compile 2>&1 | head -20

      - name: Run engine tests
        run: npm run test

      - name: Run Hardhat tests
        run: npm run test:hardhat

      - name: Run NFT contract tests
        run: npm run test:contract:nft

      - name: Run normalizer tests
        run: npm run test:normalizer

      - name: Run preflight checks
        run: npm run preflight
        env:
          ARC_RPC_URL_TESTNET: ${{ secrets.ARC_RPC_URL_TESTNET }}
          ARC_RPC_URL_MAINNET: ${{ secrets.ARC_RPC_URL_MAINNET }}
